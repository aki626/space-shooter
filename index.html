<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>海戦ゲーム</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<h1>⚓ 海戦ゲーム</h1>


<div id="select">

<h2>艦を選択</h2>

<button onclick="selectShip('destroyer')">
🚢 駆逐艦
</button>

<button onclick="selectShip('battleship')">
⚓ 戦艦
</button>

<button onclick="selectShip('carrier')">
🛳️ 空母
</button>

</div>



<canvas id="game"></canvas>



<div id="controls">


<button id="left">
⬅
</button>


<button id="shoot">
💥
</button>


<button id="fighter" style="display:none;">
✈️
</button>


<button id="right">
➡
</button>


</div>



<div id="info">

<p id="waveText">
WAVE 1
</p>

</div>



<script src="game.js"></script>


</body>
</html>
