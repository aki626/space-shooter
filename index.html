<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>海戦ゲーム</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="title">


<h1>⚓ 海戦ゲーム</h1>


<h2>艦を選択</h2>


<button onclick="selectShip('destroyer')">
🚤 駆逐艦
</button>


<button onclick="selectShip('battleship')">
⚓ 戦艦
</button>


<button onclick="selectShip('carrier')">
🛳️ 空母
</button>



<p id="shipInfo">
艦を選択してください
</p>



<button id="startButton" onclick="startGame()">
▶ START
</button>


</div>





<canvas id="game"></canvas>




<div id="controls">


<button id="left">
⬅
</button>



<button id="shoot">
💥
</button>



<button id="fighter" style="display:none">
✈️
</button>



<button id="right">
➡
</button>


</div>





<div id="status">


<p id="wave">
WAVE 1
</p>


<p id="hp">
HP 100
</p>


<p id="score">
SCORE 0
</p>



</div>





<script src="game.js"></script>


</body>

</html>
